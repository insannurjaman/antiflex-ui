name: Prepare alpha release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm installer:smoke
      - name: Verify release tag matches the installer version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'const p=require("./packages/cli/package.json");if(process.env.GITHUB_REF_NAME!=="v"+p.version)throw Error("Tag/version mismatch")'
      - run: pnpm release:prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chamfer-alpha
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
            artifacts/RELEASE_NOTES.md
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chamfer-alpha
          path: release
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to replace assets on a published release.'; exit 1; }
            gh release upload "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS --draft --prerelease --title "Chamfer UI $GITHUB_REF_NAME" --notes-file release/RELEASE_NOTES.md
          fi
