name: Bug report
description: Report a component, theme, or documentation problem.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the component, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide steps or a minimal example. Include browser and theme.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Chamfer version
